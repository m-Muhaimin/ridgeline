# Edge for RidgeLine — mounted read-only by the `edge` service in
# docker-compose.yml as /etc/nginx/nginx.conf (replaces the image's default).
#
# It is the ONLY public listener. The two app containers are reachable on the
# compose network alone, so the browser keeps talking to a single origin and the
# session cookie is set for that one host.
#
#   /api/*       -> api:3000   (Express)
#   /webhooks/*  -> api:3000   (Express — Twilio signature validation)
#   everything else -> web:3001 (Next.js)
#
# /webhooks/* must reach Express: the validation URL is rebuilt from APP_URL (or
# the request host), and Next's dev rewrite deliberately does not proxy webhooks.

worker_processes auto;
server_tokens off;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr $host "$request" $status '
                    'body=$body_bytes_sent rt=$request_time '
                    'upstream=$upstream_addr urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    # Twilio media and the AI pipeline can both be larger / slower than the
    # 1m / 60s defaults.
    client_max_body_size 10m;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # Docker's embedded DNS (its /etc/resolv.conf nameserver; Docker substitutes
    # the __VG_IPV4_*__ name at runtime on both Linux and Docker Desktop).
    # proxy_pass below interpolates a variable, so nginx resolves per request
    # instead of caching the address once at startup — otherwise a recreated
    # api/web container (new IP) would keep being proxied to a dead address until
    # nginx was restarted too. If resolution ever fails on your host, drop the
    # `resolver` line, the `$ridgeline_upstream` map and this variable form in
    # favour of plain `upstream` blocks with `server api:3000;`.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # One routing table, one proxy block. `(/|$)` matches /api, /api/ and
    # /api/<path> but not /apixyz, mirroring Next's /api/:path* rewrite.
    map $uri $ridgeline_upstream {
        default            "http://web:3001";
        "~^/api(/|$)"      "http://api:3000";
        "~^/webhooks(/|$)" "http://api:3000";
    }

    # WebSocket upgrade passthrough (Next's own guidance; inert in production
    # where hot reload is off).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Liveness for the edge itself — useful as a load-balancer probe and as
        # the compose healthcheck. Does not depend on either app container.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            # Variable form: the URI must be passed explicitly, and $request_uri
            # carries the original path *and* query string, untouched.
            proxy_pass $ridgeline_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Preserve the real public host. $http_host (not $host) so a
            # non-default port is kept: the app's same-origin check compares the
            # browser's Origin host against this Host header, and Twilio
            # signature validation is built from the request host.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
